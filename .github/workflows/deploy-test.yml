name: Deploy Test Site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Gate — typecheck both packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm ci
        working-directory: control-plane
      - run: npm run typecheck
        working-directory: control-plane

  deploy-test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to test site only
        run: |
          echo "Triggering deploy for the test site only..."

          # Check that secrets are configured
          if [ -z "${{ secrets.CONTROL_PLANE_URL }}" ] || [ -z "${{ secrets.CONTROL_PLANE_API_KEY }}" ]; then
            echo "⚠️  Skipping — GitHub Actions secrets not configured."
            echo "Set these in your repo: Settings → Secrets and variables → Actions"
            echo "  CONTROL_PLANE_URL    (e.g. https://gear-glitch-control-plane.onrender.com)"
            echo "  CONTROL_PLANE_API_KEY (an ADMIN user's per-user API key from the control plane:"
            echo "                          Settings → Users → your admin account → API Key, starts with 'cp_')"
            exit 0
          fi

          GIT_SHA="${{ github.sha }}"
          GIT_MSG="${{ github.event.head_commit.message }}"
          if [ -z "$GIT_MSG" ]; then GIT_MSG="manual dispatch"; fi
          GIT_MSG=$(echo "$GIT_MSG" | head -n 1)

          PAYLOAD=$(jq -n --arg sha "$GIT_SHA" --arg msg "$GIT_MSG" --arg by "push" \
            '{commit: {sha: $sha, message: $msg}, triggered_by: $by}')

          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-api-key: ${{ secrets.CONTROL_PLANE_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${{ secrets.CONTROL_PLANE_URL }}/api/deploy-test")

          BODY=$(echo "$RESP" | sed '$d')
          HTTP_CODE=$(echo "$RESP" | tail -n 1)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Deploy test failed (HTTP $HTTP_CODE):"
            echo "$BODY"
            echo ""
            echo "The test site deploy failed — production was NOT touched."
            echo "Mark a client as the test site in the control plane (Set as Test Site)."
            exit 1
          fi

          SUCCESS=$(echo "$BODY" | jq -r '[.results[] | select(.success == true)] | length' 2>/dev/null || echo "0")
          FAILED=$(echo "$BODY" | jq -r '[.results[] | select(.success == false)] | length' 2>/dev/null || echo "0")

          echo "Test site deploy complete: $SUCCESS succeeded, $FAILED failed"
          if [ "$FAILED" != "0" ]; then
            echo "$BODY" | jq -r '.results[] | select(.success == false) | "  ✗ \(.name): \(.error)"'
            exit 1
          fi

      - name: Deploy main storefront frontend to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠️  Skipping frontend deploy — VERCEL_TOKEN secret not configured."
            echo "Set it in your repo: Settings → Secrets and variables → Actions"
            exit 0
          fi

          # Trigger a git-based deploy of the current main branch (mirrors control-plane's deployViaGitApi)
          BODY=$(jq -n '{name: "gears-glitch", project: "gears-glitch", target: "production", gitSource: {type: "github", org: "puggythemeddler", repo: "Gears-Glitch", ref: "main"}}')

          CODE=$(curl -s -o /tmp/vd.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://api.vercel.com/v13/deployments")

          if [ "$CODE" != "200" ]; then
            echo "❌ Vercel deploy trigger failed (HTTP $CODE):"
            cat /tmp/vd.json
            exit 1
          fi

          DEPLOY_ID=$(jq -r '.id // empty' /tmp/vd.json)
          DEPLOY_URL=$(jq -r '.url // empty' /tmp/vd.json)
          echo "Frontend deploy triggered: ${DEPLOY_URL:-$DEPLOY_ID}"

          for i in $(seq 1 60); do
            sleep 10
            STATE=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOY_ID" | jq -r '.readyState')
            echo "  …deploy state: $STATE"
            if [ "$STATE" = "READY" ]; then
              echo "✅ Storefront deployed to https://gears-glitch.vercel.app"
              exit 0
            fi
            if [ "$STATE" = "ERROR" ]; then
              echo "❌ Vercel build failed. Check the deployment in the Vercel dashboard."
              exit 1
            fi
          done
          echo "❌ Timed out waiting for the Vercel build."
          exit 1
