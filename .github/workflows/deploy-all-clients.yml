name: Deploy to All Clients

# PRODUCTION DEPLOY — MANUAL ONLY.
# Every push to main auto-deploys to the TEST SITE first (see deploy-test.yml).
# Test the test site, then trigger this workflow deliberately to roll out to all clients.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm deploying to all production clients'
        required: true
        default: ''

jobs:
  check:
    name: Gate — typecheck both packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm ci
        working-directory: control-plane
      - run: npm run typecheck
        working-directory: control-plane

  deploy-all:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        if: github.event.inputs.confirm != 'DEPLOY'
        run: |
          echo "❌ Aborting: production deploy to all clients requires explicit confirmation."
          echo "Type DEPLOY in the 'confirm' input to run this workflow."
          exit 1

      - name: Deploy to all clients via control plane
        run: |
          echo "Triggering deploy for all active clients..."

          # Check that secrets are configured
          if [ -z "${{ secrets.CONTROL_PLANE_URL }}" ] || [ -z "${{ secrets.CONTROL_PLANE_API_KEY }}" ]; then
            echo "⚠️  Skipping — GitHub Actions secrets not configured."
            echo "Set these in your repo: Settings → Secrets and variables → Actions"
            echo "  CONTROL_PLANE_URL    (e.g. https://gear-glitch-control-plane.onrender.com)"
            echo "  CONTROL_PLANE_API_KEY (your control plane API key)"
            exit 0
          fi

          GIT_SHA="${{ github.sha }}"
          GIT_MSG="${{ github.event.head_commit.message }}"
          if [ -z "$GIT_MSG" ]; then GIT_MSG="manual production deploy"; fi
          GIT_MSG=$(echo "$GIT_MSG" | head -n 1)

          PAYLOAD=$(jq -n --arg sha "$GIT_SHA" --arg msg "$GIT_MSG" --arg by "manual" \
            '{commit: {sha: $sha, message: $msg}, triggered_by: $by}')

          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-api-key: ${{ secrets.CONTROL_PLANE_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${{ secrets.CONTROL_PLANE_URL }}/api/deploy-all")

          BODY=$(echo "$RESP" | sed '$d')
          HTTP_CODE=$(echo "$RESP" | tail -n 1)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Deploy to all clients failed (HTTP $HTTP_CODE):"
            echo "$BODY"
            exit 1
          fi

          SUCCESS=$(echo "$BODY" | jq -r '[.results[] | select(.success == true)] | length' 2>/dev/null || echo "0")
          FAILED=$(echo "$BODY" | jq -r '[.results[] | select(.success == false)] | length' 2>/dev/null || echo "0")

          echo "Deploy complete: $SUCCESS succeeded, $FAILED failed"
          if [ "$FAILED" != "0" ]; then
            echo "$BODY" | jq -r '.results[] | select(.success == false) | "  ✗ \(.name): \(.error)"'
            exit 1
          fi
