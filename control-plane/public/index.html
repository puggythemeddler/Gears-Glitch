<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gear&Glitch — Control Plane</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    h1 { font-size: 1.5rem; }
    h1 span { color: var(--primary); }
    .header-actions { display: flex; gap: 0.75rem; }
    .btn { padding: 0.5rem 1rem; border-radius: var(--radius); border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.15s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { opacity: 0.9; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { background: var(--surface); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
    .stat-card .value { font-size: 1.8rem; font-weight: 700; }
    .stat-card .label { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
    th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    th { background: var(--bg); color: var(--text-muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(59,130,246,0.05); }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.72rem; font-weight: 600; }
    .badge-active { background: rgba(34,197,94,0.15); color: var(--success); }
    .badge-provisioning { background: rgba(245,158,11,0.15); color: var(--warning); }
    .badge-failed { background: rgba(239,68,68,0.15); color: var(--danger); }
    .badge-suspended { background: rgba(148,163,184,0.15); color: var(--text-muted); }
    .badge-healthy { background: rgba(34,197,94,0.15); color: var(--success); }
    .badge-sleeping { background: rgba(245,158,11,0.15); color: var(--warning); }
    .badge-down { background: rgba(239,68,68,0.15); color: var(--danger); }
    .badge-unknown { background: rgba(148,163,184,0.15); color: var(--text-muted); }
    .actions-cell { display: flex; gap: 0.5rem; }
    .actions-cell .btn { padding: 0.3rem 0.6rem; font-size: 0.78rem; }
    .empty { text-align: center; padding: 4rem 1rem; color: var(--text-muted); }
    .empty .icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty p { margin-bottom: 1rem; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; width: 440px; max-width: 90vw; }
    .modal h2 { margin-bottom: 1rem; font-size: 1.1rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.3rem; }
    .field input, .field select { width: 100%; padding: 0.5rem 0.75rem; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.88rem; outline: none; }
    .field input:focus, .field select:focus { border-color: var(--primary); }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }

    /* Progress */
    .progress { margin-top: 1rem; font-size: 0.85rem; }
    .progress .step { padding: 0.3rem 0; display: flex; align-items: center; gap: 0.5rem; }
    .progress .step.done { color: var(--success); }
    .progress .step.active { color: var(--primary); }
    .progress .step.error { color: var(--danger); }

    /* Toast */
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem 1.25rem; font-size: 0.85rem; z-index: 200; animation: slideIn 0.3s; }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }
    @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    @media (max-width: 768px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .container { padding: 1rem; }
      table { font-size: 0.8rem; }
      th, td { padding: 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><span>Gear&Glitch</span> Control Plane</h1>
      <div class="header-actions">
        <button class="btn btn-ghost" onclick="healthCheckAll()">Health Check</button>
        <button class="btn btn-ghost" onclick="deployAll()">Deploy All</button>
        <button class="btn btn-primary" onclick="showModal()">+ Add Client</button>
      </div>
    </header>

    <div class="stats" id="stats">
      <div class="stat-card"><div class="value" id="stat-total">0</div><div class="label">Total Clients</div></div>
      <div class="stat-card"><div class="value" id="stat-active" style="color: var(--success)">0</div><div class="label">Active</div></div>
      <div class="stat-card"><div class="value" id="stat-provisioning" style="color: var(--warning)">0</div><div class="label">Provisioning</div></div>
      <div class="stat-card"><div class="value" id="stat-failed" style="color: var(--danger)">0</div><div class="label">Failed</div></div>
    </div>

    <div id="client-list"></div>
  </div>

  <!-- Add Client Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2>Add New Client</h2>
      <div id="modal-form">
        <div class="field">
          <label>Business Name</label>
          <input type="text" id="inp-name" placeholder="e.g. John's Electronics">
        </div>
        <div class="field">
          <label>Admin Email</label>
          <input type="email" id="inp-email" placeholder="e.g. john@example.com">
        </div>
        <div class="field">
          <label>Domain (optional)</label>
          <input type="text" id="inp-domain" placeholder="e.g. johns.gearglitch.com">
        </div>
        <div class="field">
          <label>Plan</label>
          <select id="inp-plan">
            <option value="starter">Starter</option>
            <option value="growth" selected>Growth</option>
            <option value="pro">Pro</option>
            <option value="enterprise">Enterprise</option>
          </select>
        </div>
      </div>
      <div id="modal-progress" style="display:none"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="hideModal()">Cancel</button>
        <button class="btn btn-primary" id="btn-create" onclick="createClient()">Create Client</button>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = localStorage.getItem("cp-api-key") || "";

    function getKey() {
      if (API_KEY) return API_KEY;
      const k = prompt("Enter Control Plane API Key:");
      if (k) { localStorage.setItem("cp-api-key", k); return k; }
      return "";
    }

    async function api(path, opts = {}) {
      const key = getKey();
      const res = await fetch(path, {
        ...opts,
        headers: { "Content-Type": "application/json", "x-api-key": key, ...(opts.headers || {}) },
      });
      return res.json();
    }

    function toast(msg, type = "success") {
      const el = document.createElement("div");
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function showModal() {
      document.getElementById("modal-overlay").classList.add("show");
      document.getElementById("modal-form").style.display = "";
      document.getElementById("modal-progress").style.display = "none";
      document.getElementById("btn-create").disabled = false;
      document.getElementById("inp-name").value = "";
      document.getElementById("inp-email").value = "";
      document.getElementById("inp-domain").value = "";
      document.getElementById("inp-plan").value = "growth";
    }

    function hideModal() {
      document.getElementById("modal-overlay").classList.remove("show");
    }

    async function loadClients() {
      try {
        const data = await api("/api/clients");
        const clients = data.clients || [];
        renderStats(clients);
        renderTable(clients);
      } catch (e) {
        document.getElementById("client-list").innerHTML = '<div class="empty"><p>Failed to load clients. Check your API key.</p></div>';
      }
    }

    function renderStats(clients) {
      document.getElementById("stat-total").textContent = clients.length;
      document.getElementById("stat-active").textContent = clients.filter(c => c.status === "active").length;
      document.getElementById("stat-provisioning").textContent = clients.filter(c => c.status === "provisioning").length;
      document.getElementById("stat-failed").textContent = clients.filter(c => c.status === "failed").length;
    }

    function renderTable(clients) {
      if (clients.length === 0) {
        document.getElementById("client-list").innerHTML = '<div class="empty"><div class="icon">&#128230;</div><p>No clients yet</p><button class="btn btn-primary" onclick="showModal()">+ Add Your First Client</button></div>';
        return;
      }

      let html = `<table>
        <thead><tr>
          <th>Name</th><th>Domain</th><th>Plan</th><th>Status</th><th>Health</th><th>Created</th><th>Actions</th>
        </tr></thead><tbody>`;

      for (const c of clients) {
        const created = new Date(c.created_at).toLocaleDateString();
        const healthTime = c.last_health_check ? new Date(c.last_health_check).toLocaleTimeString() : "";
        html += `<tr>
          <td><strong>${esc(c.name)}</strong><br><span style="color:var(--text-muted);font-size:0.75rem">${esc(c.admin_email)}</span></td>
          <td>${esc(c.domain)}</td>
          <td>${esc(c.plan)}</td>
          <td><span class="badge badge-${c.status}">${c.status}</span></td>
          <td><span class="badge badge-${c.health_status}">${c.health_status}</span> ${healthTime ? '<span style="font-size:0.7rem;color:var(--text-muted)">' + healthTime + '</span>' : ''}</td>
          <td>${created}</td>
          <td><div class="actions-cell">
            ${c.render_service_url ? '<a href="' + esc(c.render_service_url) + '" target="_blank" class="btn btn-ghost">Backend</a>' : ''}
            ${c.vercel_project_url ? '<a href="' + esc(c.vercel_project_url) + '" target="_blank" class="btn btn-ghost">Frontend</a>' : ''}
            <button class="btn btn-danger" onclick="deleteClient(${c.id}, '${esc(c.name)}')">Delete</button>
          </div></td>
        </tr>`;
      }

      html += "</tbody></table>";
      document.getElementById("client-list").innerHTML = html;
    }

    function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

    async function createClient() {
      const name = document.getElementById("inp-name").value.trim();
      const email = document.getElementById("inp-email").value.trim();
      const domain = document.getElementById("inp-domain").value.trim();
      const plan = document.getElementById("inp-plan").value;

      if (!name || !email) { toast("Name and email are required", "error"); return; }

      document.getElementById("btn-create").disabled = true;
      const prog = document.getElementById("modal-progress");
      document.getElementById("modal-form").style.display = "none";
      prog.style.display = "";
      prog.innerHTML = '<div class="progress"><div class="step active">Provisioning "' + esc(name) + '"...</div></div>';

      try {
        const data = await api("/api/clients", {
          method: "POST",
          body: JSON.stringify({ name, adminEmail: email, plan, domain: domain || undefined }),
        });

        if (data.error) {
          prog.innerHTML = '<div class="progress"><div class="step error">Error: ' + esc(data.error) + '</div></div>';
          document.getElementById("btn-create").disabled = false;
          return;
        }

        prog.innerHTML = '<div class="progress"><div class="step done">Provisioning started!</div><div class="step" style="color:var(--text-muted)">Client ID: ' + data.clientId + '</div><div class="step" style="color:var(--text-muted)">This may take 2-5 minutes. Refresh to see status.</div></div>';

        setTimeout(() => { hideModal(); loadClients(); }, 2000);
      } catch (e) {
        prog.innerHTML = '<div class="progress"><div class="step error">Error: ' + esc(e.message) + '</div></div>';
        document.getElementById("btn-create").disabled = false;
      }
    }

    async function deleteClient(id, name) {
      if (!confirm('Delete "' + name + '"? This will remove their database and all deployments.')) return;
      try {
        const data = await api("/api/clients/" + id, { method: "DELETE" });
        toast(data.message || "Deleted");
        loadClients();
      } catch (e) { toast("Delete failed", "error"); }
    }

    async function deployAll() {
      if (!confirm("Deploy latest code to ALL active clients?")) return;
      toast("Deploying to all clients...");
      try {
        const data = await api("/api/deploy-all", { method: "POST" });
        const results = data.results || [];
        const ok = results.filter(r => r.success).length;
        const fail = results.filter(r => !r.success).length;
        toast(`Deployed: ${ok} succeeded, ${fail} failed`);
      } catch (e) { toast("Deploy failed", "error"); }
    }

    async function healthCheckAll() {
      toast("Checking health of all clients...");
      try {
        const data = await api("/api/health-check", { method: "POST" });
        const results = data.results || [];
        const healthy = results.filter(r => r.status === "healthy").length;
        const sleeping = results.filter(r => r.status === "sleeping").length;
        const down = results.filter(r => r.status === "down").length;
        toast(`Health: ${healthy} healthy, ${sleeping} sleeping, ${down} down`);
        loadClients();
      } catch (e) { toast("Health check failed", "error"); }
    }

    // Auto-refresh every 30s
    loadClients();
    setInterval(loadClients, 30000);
  </script>
</body>
</html>
