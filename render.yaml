services:
  - type: web
    name: gear-glitch-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: rm -rf node_modules && cd frontend && rm -rf node_modules && npm install && cd .. && npm install && npm run build
    startCommand: node dist/server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8020
      - key: BASE_URL
        value: https://gear-glitch-backend.onrender.com
    healthCheckPath: /api/health
    autoDeploy: true
