services:
  - type: web
    name: gear-glitch-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --omit=optional && npx tsc
    startCommand: node dist/server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 8020
      - key: BASE_URL
        value: https://gears-glitch.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: gear-glitch
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        value: Gear&Glitch
      - key: DB_SSL_REJECT
        value: "false"
      # Shared secret for control-plane machine-to-machine management (min 16 chars).
      # Leave unset to disable remote management entirely.
      - key: CONTROL_PLANE_SECRET
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
