services:
  - type: web
    name: gear-glitch-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: rm -rf node_modules dist && npm install && npx tsc
    startCommand: node dist/server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8020
      - key: BASE_URL
        value: https://gears-glitch.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: gear-glitch
    healthCheckPath: /api/health
    autoDeploy: true
